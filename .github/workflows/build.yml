name: Build Camera27 rootless package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang make perl dpkg-dev fakeroot git curl xz-utils libssl-dev libplist-dev
      - name: Install ldid
        run: |
          git clone --depth=1 https://github.com/ProcursusTeam/ldid.git /tmp/ldid
          make -C /tmp/ldid
          sudo install -m 0755 /tmp/ldid/ldid /usr/local/bin/ldid
      - name: Install Theos and SDKs
        run: |
          git clone --depth=1 --recursive https://github.com/theos/theos.git "$HOME/theos"
          rm -rf "$HOME/theos/sdks"
          git clone --depth=1 https://github.com/theos/sdks.git "$HOME/theos/sdks"
          curl -fsSL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJ -C "$HOME/theos/toolchain/"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Build rootless arm64 package
        run: make clean && make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
      - name: Validate package
        run: |
          deb=$(find packages -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          dpkg-deb --fsys-tarfile "$deb" | tar -tf - | grep -q 'Library/MobileSubstrate/DynamicLibraries/Camera27.dylib'
          cp "$deb" packages/Camera27-rootless.deb
      - uses: actions/upload-artifact@v4
        with:
          name: Camera27-rootless
          path: packages/Camera27-rootless.deb
          if-no-files-found: error
