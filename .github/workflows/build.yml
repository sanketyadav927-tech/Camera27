name: Build Camera27 Rootless .deb

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            fakeroot \
            git \
            curl \
            perl \
            zstd \
            unzip \
            xz-utils
          # Support both libtinfo5 (Ubuntu 22.04) and libtinfo6 (Ubuntu 24.04)
          sudo apt-get install -y --no-install-recommends libtinfo5 || sudo apt-get install -y --no-install-recommends libtinfo6 || true
          # Compatibility symlinks for older toolchain binaries
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5 || true

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup iOS SDK
        run: |
          rm -rf ~/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git ~/theos/sdks
          echo "Available SDKs:"
          ls -la ~/theos/sdks

      - name: Setup iOS Arm64 Linux Toolchain
        run: |
          mkdir -p ~/theos/toolchain/linux/iphone
          curl -fsSL -o /tmp/toolchain.tar.gz https://github.com/CRKatri/llvm-project/releases/download/12.0.0-theos/ios-arm64-toolchain-linux.tar.gz
          # Extract directly or with strip-components if archive contains top-level directory
          tar -xzf /tmp/toolchain.tar.gz -C ~/theos/toolchain/linux/iphone/ --strip-components=1 2>/dev/null || \
          tar -xzf /tmp/toolchain.tar.gz -C ~/theos/toolchain/linux/iphone/
          echo "Toolchain binaries:"
          ls -la ~/theos/toolchain/linux/iphone/bin/ || true

      - name: Build Rootless Package
        run: |
          export THEOS=$HOME/theos
          make clean
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1

      - name: Validate .deb Package
        run: |
          DEB_FILE=$(ls -t packages/*.deb | head -n 1)
          if [ ! -f "$DEB_FILE" ]; then
            echo "Error: No .deb file generated in packages directory!"
            exit 1
          fi
          echo "Generated .deb: $DEB_FILE"
          dpkg-deb -I "$DEB_FILE"
          dpkg-deb -c "$DEB_FILE"
          cp "$DEB_FILE" packages/Camera27-rootless.deb

      - name: Upload Rootless .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Camera27-rootless
          path: packages/Camera27-rootless.deb
          if-no-files-found: error
